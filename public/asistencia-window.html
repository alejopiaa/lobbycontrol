<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LobbyControl - Asistencia Técnica</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide & Theme -->
  <script src="/vendor/lucide.min.js"></script>
  <script src="/js/theme-init.js?v=1.0.21"></script>
  <link rel="stylesheet" href="/css/output.css">
</head>
<body class="h-full flex flex-col font-sans antialiased overflow-hidden select-none relative">

  <!-- CONTENEDOR DE TOASTS FLOTANTES -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <!-- MODAL DE CONFIRMACIÓN ELEGANTE -->
  <div id="confirm-modal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-bg-card border border-border-ui rounded-2xl p-5 max-w-sm w-full shadow-2xl space-y-4 animate-in fade-in zoom-in duration-150">
      <div class="flex items-start gap-3">
        <div id="confirm-modal-icon-container" class="h-9 w-9 rounded-xl bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20 flex items-center justify-center shrink-0">
          <i data-lucide="alert-circle" class="h-5 w-5"></i>
        </div>
        <div class="space-y-1">
          <h3 id="confirm-modal-title" class="text-xs font-bold text-text-primary">Confirmación</h3>
          <p id="confirm-modal-msg" class="text-xs text-text-tertiary">¿Estás seguro de realizar esta acción?</p>
        </div>
      </div>
      <div class="flex items-center justify-end gap-2 pt-2 border-t border-border-ui">
        <button id="btn-confirm-cancel" type="button" class="h-8 px-3 rounded-lg text-xs font-semibold bg-bg-card border border-border-ui text-text-secondary hover:bg-border-ui hover:text-text-primary transition-colors cursor-pointer">
          Cancelar
        </button>
        <button id="btn-confirm-accept" type="button" class="h-8 px-3.5 rounded-lg text-xs font-bold bg-rose-600 hover:bg-rose-500 text-white shadow-xs transition-colors cursor-pointer">
          Descartar
        </button>
      </div>
    </div>
  </div>

  <!-- CABECERA -->
  <header class="h-14 px-6 bg-bg-header border-b border-border-ui flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-3">
      <div class="h-8 w-8 rounded-lg bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20 flex items-center justify-center shrink-0">
        <i data-lucide="headset" class="h-4 w-4"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-text-primary tracking-tight">Asistencia Técnica</span>
          <span id="badge-ticket-draft" class="px-1.5 py-0.5 rounded font-mono text-[9px] font-bold bg-border-ui text-text-secondary border border-border-ui">AST-NUEVA</span>
        </div>
        <span id="live-clock" class="text-[10px] text-text-tertiary block mt-0.5">--:--:--</span>
      </div>
    </div>

    <!-- CONTROLES DERECHA -->
    <div class="flex items-center gap-2">
      <!-- Fijar Ventana -->
      <button id="btn-always-on-top" type="button" class="h-7 px-2 rounded-lg text-[10px] font-semibold flex items-center gap-1 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20 cursor-pointer" title="Fijar ventana al frente">
        <i data-lucide="pin" class="h-3 w-3"></i>
        <span>Fijado</span>
      </button>
    </div>
  </header>

  <!-- FORMULARIO PRINCIPAL -->
  <main class="flex-1 overflow-y-auto p-6 space-y-5">

    <!-- 1. CLASIFICACIÓN DE LA ATENCIÓN Y FOLIO (3 COLUMNAS) -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
      <!-- Canal de Contacto -->
      <div class="relative">
        <label class="block text-xs font-semibold text-text-secondary mb-1.5">Canal de Contacto</label>
        <button id="btn-dropdown-canal" type="button" class="form-field-control w-full bg-bg-card border border-border-ui rounded-lg px-3 py-2 text-xs text-text-primary flex items-center justify-between shadow-2xs hover:border-brand-500 transition-colors cursor-pointer">
          <span id="selected-canal-label" class="flex items-center gap-2 truncate">
            <i data-lucide="phone" class="h-3.5 w-3.5 text-brand-500 shrink-0"></i>
            <span class="truncate">Teléfono</span>
          </span>
          <i data-lucide="chevron-down" class="h-3.5 w-3.5 text-text-tertiary shrink-0 ml-1"></i>
        </button>
        <div id="menu-dropdown-canal" class="hidden absolute top-full left-0 right-0 mt-1.5 bg-bg-header border border-border-ui rounded-xl shadow-xl z-50 py-1 divide-y divide-border-ui">
          <button type="button" class="option-canal w-full px-3.5 py-2 text-left text-xs font-medium hover:bg-border-ui flex items-center gap-2.5 cursor-pointer text-text-primary" data-value="telefono" data-label="Teléfono" data-icon="phone">
            <i data-lucide="phone" class="h-3.5 w-3.5 text-brand-500"></i>
            <span>Teléfono</span>
          </button>
          <button type="button" class="option-canal w-full px-3.5 py-2 text-left text-xs font-medium hover:bg-border-ui flex items-center gap-2.5 cursor-pointer text-text-primary" data-value="correo" data-label="Correo" data-icon="mail">
            <i data-lucide="mail" class="h-3.5 w-3.5 text-brand-500"></i>
            <span>Correo</span>
          </button>
          <button type="button" class="option-canal w-full px-3.5 py-2 text-left text-xs font-medium hover:bg-border-ui flex items-center gap-2.5 cursor-pointer text-text-primary" data-value="presencial" data-label="Presencial" data-icon="users">
            <i data-lucide="users" class="h-3.5 w-3.5 text-brand-500"></i>
            <span>Presencial</span>
          </button>
          <button type="button" class="option-canal w-full px-3.5 py-2 text-left text-xs font-medium hover:bg-border-ui flex items-center gap-2.5 cursor-pointer text-text-primary" data-value="teams" data-label="Teams" data-icon="message-square">
            <i data-lucide="message-square" class="h-3.5 w-3.5 text-brand-500"></i>
            <span>Teams</span>
          </button>
        </div>
      </div>

      <!-- Materia / Categoría -->
      <div class="relative">
        <label class="block text-xs font-semibold text-text-secondary mb-1.5">Materia / Categoría</label>
        <button id="btn-dropdown-categoria" type="button" class="form-field-control w-full bg-bg-card border border-border-ui rounded-lg px-3 py-2 text-xs text-text-primary flex items-center justify-between shadow-2xs hover:border-brand-500 transition-colors cursor-pointer">
          <span id="selected-categoria-label" class="flex items-center gap-2 truncate">
            <i data-lucide="tag" class="h-3.5 w-3.5 text-brand-500 shrink-0"></i>
            <span class="truncate">Plazos Legales</span>
          </span>
          <i data-lucide="chevron-down" class="h-3.5 w-3.5 text-text-tertiary shrink-0 ml-1"></i>
        </button>
        <div id="menu-dropdown-categoria" class="hidden absolute top-full left-0 right-0 mt-1.5 bg-bg-header border border-border-ui rounded-xl shadow-xl z-50 py-1 max-h-56 overflow-y-auto divide-y divide-border-ui">
          <div id="list-categorias-options"></div>
        </div>
      </div>

      <!-- Folio Lobby (Opcional) -->
      <div>
        <label class="block text-xs font-semibold text-text-secondary mb-1.5">Folio Lobby (Opcional)</label>
        <input type="text" id="input-folio" class="form-field-control w-full bg-bg-card border border-border-ui rounded-lg px-3 py-2 text-xs font-mono uppercase text-text-primary placeholder:text-text-tertiary focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-colors shadow-2xs" placeholder="MU163...">
      </div>
    </div>

    <!-- 2. SECCIÓN: FUNCIONARIO / SOLICITANTE -->
    <div class="space-y-3">
      <div class="flex items-center justify-between pb-1.5 border-b border-border-ui">
        <span class="text-[11px] font-bold uppercase tracking-wider text-text-tertiary flex items-center gap-1.5">
          <i data-lucide="user-check" class="h-3.5 w-3.5 text-brand-500"></i>
          Funcionario / Solicitante
        </span>
        <span id="indicator-contacto-vinculado" class="hidden text-[10px] font-bold text-emerald-600 dark:text-emerald-400 flex items-center gap-1">
          <i data-lucide="check" class="h-3 w-3"></i> En Directorio
        </span>
      </div>

      <!-- Nombre con autocompletado -->
      <div class="relative">
        <input type="text" id="input-solicitante" class="form-field-control w-full bg-bg-card border border-border-ui rounded-lg px-3.5 py-2 text-xs text-text-primary placeholder:text-text-tertiary focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-colors shadow-2xs" placeholder="Nombre completo del solicitante *" autocomplete="off">
        <div id="autocomplete-suggestions" class="hidden absolute top-full left-0 right-0 mt-1.5 bg-bg-header border border-border-ui rounded-xl shadow-xl z-50 max-h-48 overflow-y-auto divide-y divide-border-ui"></div>
      </div>

      <!-- Dirección / Depto (Combobox Desplegable Editable) -->
      <div class="relative">
        <div class="relative flex items-center">
          <input type="text" id="input-depto" class="form-field-control w-full bg-bg-card border border-border-ui rounded-lg pl-3.5 pr-8 py-2 text-xs text-text-primary placeholder:text-text-tertiary focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-colors shadow-2xs" placeholder="Dirección o departamento (Ej: DOM, SECMUN, DIDECO)" autocomplete="off">
          <button id="btn-toggle-depto-dropdown" type="button" class="absolute right-2 text-text-tertiary hover:text-text-primary p-1 cursor-pointer" title="Ver lista de direcciones">
            <i data-lucide="chevron-down" class="h-3.5 w-3.5"></i>
          </button>
        </div>
        <div id="menu-dropdown-depto" class="hidden absolute top-full left-0 right-0 mt-1.5 bg-bg-header border border-border-ui rounded-xl shadow-xl z-50 max-h-52 overflow-y-auto divide-y divide-border-ui"></div>
      </div>

      <!-- Correo y Anexo (2 Columnas) -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <input type="email" id="input-correo" class="form-field-control w-full bg-bg-card border border-border-ui rounded-lg px-3.5 py-2 text-xs text-text-primary placeholder:text-text-tertiary focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-colors shadow-2xs" placeholder="Correo electrónico">
        </div>
        <div>
          <input type="text" id="input-contacto" inputmode="numeric" class="form-field-control w-full bg-bg-card border border-border-ui rounded-lg px-3.5 py-2 text-xs text-text-primary placeholder:text-text-tertiary focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-colors shadow-2xs font-mono" placeholder="Anexo o teléfono (solo números)">
        </div>
      </div>
    </div>

    <!-- 3. SECCIÓN: DETALLE DE LA ATENCIÓN -->
    <div class="space-y-3">
      <div class="pb-1.5 border-b border-border-ui">
        <span class="text-[11px] font-bold uppercase tracking-wider text-text-tertiary flex items-center gap-1.5">
          <i data-lucide="message-square" class="h-3.5 w-3.5 text-brand-500"></i>
          Detalle de la Atención
        </span>
      </div>

      <div>
        <label class="block text-xs font-semibold text-text-secondary mb-1.5">Motivo de la Consulta *</label>
        <textarea id="input-motivo" rows="3" class="form-field-control w-full bg-bg-card border border-border-ui rounded-lg px-3.5 py-2.5 text-xs text-text-primary placeholder:text-text-tertiary focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-colors resize-none leading-relaxed shadow-2xs" placeholder="Describe brevemente la consulta realizada..."></textarea>
      </div>

      <div>
        <label class="block text-xs font-semibold text-text-secondary mb-1.5">Orientación o Solución Entregada</label>
        <textarea id="input-solucion" rows="3" class="form-field-control w-full bg-bg-card border border-border-ui rounded-lg px-3.5 py-2.5 text-xs text-text-primary placeholder:text-text-tertiary focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-colors resize-none leading-relaxed shadow-2xs" placeholder="Indica la orientación normativa o respuesta brindada..."></textarea>
      </div>
    </div>

    <!-- 4. ESTADO DE CIERRE -->
    <div class="space-y-1.5">
      <label class="block text-xs font-semibold text-text-secondary">Estado de Cierre</label>
      <div class="relative">
        <button id="btn-dropdown-estado" type="button" class="form-field-control w-full sm:w-72 bg-bg-card border border-border-ui rounded-lg px-3 py-2 text-xs text-text-primary flex items-center justify-between shadow-2xs hover:border-brand-500 transition-colors cursor-pointer">
          <span id="selected-estado-label" class="flex items-center gap-2">
            <span class="h-2 w-2 rounded-full bg-emerald-500"></span>
            <span>Resuelta</span>
          </span>
          <i data-lucide="chevron-down" class="h-3.5 w-3.5 text-text-tertiary"></i>
        </button>
        <div id="menu-dropdown-estado" class="hidden absolute bottom-full left-0 mb-1.5 w-72 bg-bg-header border border-border-ui rounded-xl shadow-xl z-50 py-1 divide-y divide-border-ui">
          <button type="button" class="option-estado w-full px-3.5 py-2 text-left text-xs font-medium hover:bg-border-ui flex items-center gap-2 cursor-pointer text-text-primary" data-value="resuelta" data-label="Resuelta" data-color="bg-emerald-500">
            <span class="h-2 w-2 rounded-full bg-emerald-500"></span>
            <span>Resuelta (Inmediata)</span>
          </button>
          <button type="button" class="option-estado w-full px-3.5 py-2 text-left text-xs font-medium hover:bg-border-ui flex items-center gap-2 cursor-pointer text-text-primary" data-value="en_seguimiento" data-label="En Seguimiento" data-color="bg-amber-500">
            <span class="h-2 w-2 rounded-full bg-amber-500"></span>
            <span>En Seguimiento</span>
          </button>
          <button type="button" class="option-estado w-full px-3.5 py-2 text-left text-xs font-medium hover:bg-border-ui flex items-center gap-2 cursor-pointer text-text-primary" data-value="derivada" data-label="Derivada" data-color="bg-blue-500">
            <span class="h-2 w-2 rounded-full bg-blue-500"></span>
            <span>Derivada a otra área</span>
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- BARRA INFERIOR DE ACCIONES -->
  <footer class="h-14 px-6 bg-bg-header border-t border-border-ui flex items-center justify-between shrink-0 gap-3 z-30">
    <div class="flex items-center gap-2 shrink-0">
      <!-- Descartar / Limpiar (Modo Nueva) -->
      <button id="btn-descartar" type="button" class="h-9 px-3 rounded-lg text-xs font-semibold bg-bg-card text-text-secondary hover:bg-rose-500/10 hover:text-rose-600 dark:hover:text-rose-400 border border-border-ui transition-colors flex items-center gap-1.5 cursor-pointer shadow-2xs" title="Descartar y limpiar formulario">
        <i data-lucide="trash-2" class="h-3.5 w-3.5"></i>
        <span>Descartar</span>
      </button>

      <!-- Nueva Llamada (Modo Nueva tras guardar) -->
      <button id="btn-nueva-llamada" type="button" class="h-9 px-3 rounded-lg text-xs font-semibold bg-bg-card text-text-secondary hover:bg-border-ui hover:text-text-primary border border-border-ui transition-colors flex items-center gap-1.5 cursor-pointer shadow-2xs" title="Iniciar nueva atención">
        <i data-lucide="plus" class="h-3.5 w-3.5"></i>
        <span>Nueva</span>
      </button>

      <!-- Correo (Deshabilitado hasta guardar) -->
      <button id="btn-enviar-correo" type="button" disabled class="h-9 px-3 rounded-lg text-xs font-semibold bg-bg-card text-text-secondary border border-border-ui opacity-40 pointer-events-none transition-all flex items-center gap-1.5 shadow-2xs" title="Generar correo Outlook">
        <i data-lucide="mail" class="h-3.5 w-3.5"></i>
        <span>Correo</span>
      </button>

      <!-- PDF (Deshabilitado hasta guardar) -->
      <button id="btn-ficha-pdf" type="button" disabled class="h-9 px-3 rounded-lg text-xs font-semibold bg-bg-card text-text-secondary border border-border-ui opacity-40 pointer-events-none transition-all flex items-center gap-1.5 shadow-2xs" title="Exportar Ficha PDF">
        <i data-lucide="file-text" class="h-3.5 w-3.5"></i>
        <span>PDF</span>
      </button>
    </div>

    <!-- Acciones Derecha: Cancelar Edición / Guardar / Editar -->
    <div class="flex items-center gap-2">
      <!-- Cancelar / Descartar Cambios (Solo visible en modo edición) -->
      <button id="btn-cancelar-edicion" type="button" class="hidden h-9 px-3 rounded-lg text-xs font-semibold bg-bg-card text-text-secondary hover:bg-rose-500/10 hover:text-rose-600 dark:hover:text-rose-400 border border-border-ui transition-colors flex items-center gap-1.5 cursor-pointer shadow-2xs" title="Cancelar edición y restaurar valores originales">
        <i data-lucide="x" class="h-3.5 w-3.5"></i>
        <span>Cancelar</span>
      </button>

      <!-- Botón Principal: Guardar / Editar -->
      <button id="btn-guardar" type="button" data-mode="save" class="h-9 px-4.5 rounded-lg text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white shadow-2xs transition-all flex items-center justify-center gap-2 cursor-pointer whitespace-nowrap active:scale-95">
        <i data-lucide="save" class="h-4 w-4" id="btn-guardar-icon"></i>
        <span id="btn-guardar-text">Guardar (Ctrl+Enter)</span>
      </button>
    </div>
  </footer>

  <script src="/js/asistencia-window.js?v=1.0.27"></script>
</body>
</html>
